    <script>
        // Download page: device-aware two-store routing + paid/UTM attribution (Jun 21, 2026).
        // - Show ONE prominent store button for the visitor's OS; the other collapses to a quiet
        //   link. Desktop/unknown sees both. The video says "iOS & Android" so both must work.
        // - Propagate incoming UTM params into the Google Play install referrer (Play Console
        //   attribution). Apple ignores URL referrers (ASA-API only) so the iOS link stays clean.
        // - Fire a labeled GA4 store_click event (store: ios|android) carrying utm params.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var utmKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
            var utmPairs = utmKeys
                .map(function (k) { var v = params.get(k); return v ? k + '=' + v : null; })
                .filter(Boolean);

            var iosBtn = document.querySelector('a[href*="apps.apple.com"]');
            var androidBtn = document.querySelector('a[href*="play.google.com"]');

            // Google Play install referrer (URL-encoded UTM string), only when UTMs are present.
            if (androidBtn && utmPairs.length) {
                var base = androidBtn.getAttribute('href');
                if (base.indexOf('referrer=') === -1) {
                    var joiner = base.indexOf('?') === -1 ? '?' : '&';
                    androidBtn.setAttribute('href', base + joiner + 'referrer=' + encodeURIComponent(utmPairs.join('&')));
                }
            }

            function fireStoreClick(store) {
                try {
                    gtag('event', 'store_click', {
                        store: store,
                        utm_source: params.get('utm_source') || '',
                        utm_campaign: params.get('utm_campaign') || '',
                        // sendBeacon survives the immediate app-switch when iOS opens the App Store,
                        // so iOS taps aren't lost when Safari unloads before the event flushes.
                        transport_type: 'beacon'
                    });
                } catch (e) {}
            }
            if (iosBtn) iosBtn.addEventListener('click', function () { fireStoreClick('ios'); });
            if (androidBtn) androidBtn.addEventListener('click', function () { fireStoreClick('android'); });

            // Device-aware: one primary button for the visitor's OS, the other as a quiet link.
            function makeSecondary(btn, label) {
                if (!btn) return;
                btn.classList.add('secondary');
                btn.textContent = label; // keeps href + click listener; just swaps the visible label
            }
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
            var isAndroid = /android/i.test(ua);
            if (isIOS && !isAndroid) {
                makeSecondary(androidBtn, 'On Android instead?');
            } else if (isAndroid) {
                makeSecondary(iosBtn, 'On iPhone instead?');
            }
            // Desktop / unknown: leave both buttons full-size.
        })();
    </script>
